<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviator - IA Padrões</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0d0d;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin: 0 0 8px;
    font-size: 30px;
}

.subtitulo {
    color: #aaa;
    margin-bottom: 20px;
}

.card {
    background: #151515;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 18px;
}

.botoes {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 16px 24px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    opacity: .7;
}

.reset {
    background: #286cf0;
    color: white;
}

.padroes-btn {
    background: #ffd21c;
    color: #111;
}

.azul-btn {
    background: #286cf0;
    color: white;
}

.roxo-btn {
    background: #8b24f5;
    color: white;
}

.vermelho-btn {
    background: #f442a4;
    color: white;
}

.historico {
    min-height: 90px;
    margin-top: 18px;
    background: #080f13;
    border-radius: 12px;
    padding: 18px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
}

.bloco-cor {
    width: 56px;
    height: 56px;
    border-radius: 10px;
}

.azul {
    background: #286cf0;
}

.roxo {
    background: #8b24f5;
}

.vermelho {
    background: #f442a4;
}

.legenda {
    color: #aaa;
    font-size: 18px;
    margin-top: 12px;
}

.sequencia-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 14px;
    background: #080d12;
    font-size: 18px;
    line-height: 1.8;
}

.resultado {
    margin-top: 15px;
    font-size: 21px;
    font-weight: bold;
}

.regra {
    color: #aaa;
    font-size: 16px;
}

.previsao {
    background: #080f13;
    border-radius: 12px;
    padding: 24px;
    text-align: center;
}

.previsao-titulo {
    color: #aaa;
    font-size: 16px;
}

.sequencia-grande {
    margin-top: 8px;
    font-size: 28px;
    font-weight: bold;
}

.proxima {
    margin-top: 8px;
    font-size: 36px;
    font-weight: bold;
}

.proxima.azul-texto {
    color: #286cf0;
}

.proxima.roxo-texto {
    color: #8b24f5;
}

.proxima.vermelho-texto {
    color: #f442a4;
}

.barra-item {
    margin-top: 18px;
}

.barra-nome {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    margin-bottom: 5px;
}

.barra {
    height: 26px;
    background: #252525;
    border-radius: 20px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0;
    border-radius: 20px;
}

.fill.azul {
    background: #286cf0;
}

.fill.roxo {
    background: #8b24f5;
}

.fill.vermelho {
    background: #f442a4;
}

#padroes {
    display: none;
}

.padrao {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
}

.mini {
    width: 28px;
    height: 28px;
    border-radius: 6px;
}

@media (max-width: 600px) {

    .container {
        padding: 14px;
    }

    h1 {
        font-size: 25px;
    }

    button {
        flex: 1;
        padding: 15px 8px;
        font-size: 16px;
    }

    .proxima {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Aviator — IA Padrões</h1>

<div class="subtitulo">
Análise pela posição das cores
</div>


<div class="card">

<div class="botoes">

<button class="reset" onclick="resetar()">
Reset
</button>

<button class="padroes-btn" onclick="mostrarPadroes()">
Mostrar padrões
</button>

</div>


<div id="historico" class="historico"></div>


<div class="botoes" style="margin-top:18px;">

<button class="azul-btn" onclick="adicionar('A')">
AZUL (A)
</button>

<button class="roxo-btn" onclick="adicionar('R')">
ROXO (R)
</button>

<button class="vermelho-btn" onclick="adicionar('V')">
VERMELHO (V)
</button>

</div>


<div class="legenda">
A = Azul | R = Roxo | V = Vermelho
</div>


<div id="analise"></div>

</div>


<div class="card">

<h2>Próxima cor pela regra</h2>

<div class="previsao">

<div class="previsao-titulo">
SEQUÊNCIA ANALISADA
</div>

<div id="sequencia" class="sequencia-grande">
----
</div>

<div id="proxima" class="proxima">
PRÓXIMA: -
</div>

</div>


<div class="barra-item">

<div class="barra-nome">
<span>AZUL</span>
<span id="pctA">—</span>
</div>

<div class="barra">
<div id="fillA" class="fill azul"></div>
</div>

</div>


<div class="barra-item">

<div class="barra-nome">
<span>ROXO</span>
<span id="pctR">—</span>
</div>

<div class="barra">
<div id="fillR" class="fill roxo"></div>
</div>

</div>


<div class="barra-item">

<div class="barra-nome">
<span>VERMELHO</span>
<span id="pctV">—</span>
</div>

<div class="barra">
<div id="fillV" class="fill vermelho"></div>
</div>

</div>

</div>


<div id="padroes" class="card">

<h2>Padrões da IA</h2>

<div id="lista"></div>

</div>

</div>


<script>

/* ================================
   DADOS
================================ */

var historico = [];

var nomes = {
    A: "AZUL",
    R: "ROXO",
    V: "VERMELHO"
};


/* ================================
   ADICIONAR COR
================================ */

function adicionar(cor) {

    historico.push(cor);

    if (historico.length > 20) {
        historico.shift();
    }

    desenharHistorico();

    analisar();
}


/* ================================
   HISTÓRICO
================================ */

function desenharHistorico() {

    var caixa = document.getElementById("historico");

    caixa.innerHTML = "";

    for (var i = 0; i < historico.length; i++) {

        var div = document.createElement("div");

        div.className =
            "bloco-cor " +
            historico[i].toLowerCase();

        caixa.appendChild(div);
    }
}


/* ================================
   REGRA DA IA
================================

   XXYY

   A A R R
     ↑
   2ª COR = AZUL

   R R A A
     ↑
   2ª COR = ROXO

   V V R R
     ↑
   2ª COR = VERMELHO
================================ */

function calcularRegra(seq) {

    if (seq.length !== 4) {
        return null;
    }

    var c1 = seq.charAt(0);
    var c2 = seq.charAt(1);
    var c3 = seq.charAt(2);
    var c4 = seq.charAt(3);


    /* DUAS DUPLAS: XXYY */

    if (
        c1 === c2 &&
        c3 === c4 &&
        c1 !== c3
    ) {

        return c2;
    }


    /* QUATRO IGUAIS: XXXX */

    if (
        c1 === c2 &&
        c2 === c3 &&
        c3 === c4
    ) {

        return c2;
    }


    return null;
}


/* ================================
   ANÁLISE
================================ */

function analisar() {

    if (historico.length < 4) {

        document.getElementById("analise").innerHTML =
            '<div class="sequencia-box">' +
            'Aguardando 4 cores para analisar.' +
            '</div>';

        limparResultado();

        return;
    }


    var ultimas =
        historico.slice(historico.length - 4);

    var seq =
        ultimas.join("");


    var resultado =
        calcularRegra(seq);


    var texto =
        '<div class="sequencia-box">';

    texto +=
        "Sequência: <strong>" +
        seq +
        "</strong><br>";

    texto +=
        "1ª: " + nomes[ultimas[0]] +
        " | 2ª: " + nomes[ultimas[1]] +
        " | 3ª: " + nomes[ultimas[2]] +
        " | 4ª: " + nomes[ultimas[3]];


    if (resultado !== null) {

        texto +=
            '<div class="resultado">' +
            "PRÓXIMA COR: " +
            nomes[resultado] +
            "</div>";

        texto +=
            '<div class="regra">' +
            "Regra: a próxima cor é a 2ª cor da sequência." +
            "</div>";

        texto += "</div>";

        document.getElementById("analise").innerHTML =
            texto;


        mostrarResultado(seq, resultado);

    } else {

        texto +=
            '<div class="resultado">' +
            "PRÓXIMA COR: NÃO DEFINIDA" +
            "</div>";

        texto +=
            '<div class="regra">' +
            "A sequência não forma o padrão XXYY." +
            "</div>";

        texto += "</div>";

        document.getElementById("analise").innerHTML =
            texto;

        limparResultado();
    }
}


/* ================================
   MOSTRAR RESULTADO
================================ */

function mostrarResultado(seq, cor) {

    document.getElementById("sequencia").innerText =
        seq;

    var proxima =
        document.getElementById("proxima");

    proxima.className = "proxima";

    if (cor === "A") {
        proxima.className += " azul-texto";
    }

    if (cor === "R") {
        proxima.className += " roxo-texto";
    }

    if (cor === "V") {
        proxima.className += " vermelho-texto";
    }

    proxima.innerText =
        "PRÓXIMA: " + nomes[cor];


    /* ZERA */

    document.getElementById("fillA").style.width = "0%";
    document.getElementById("fillR").style.width = "0%";
    document.getElementById("fillV").style.width = "0%";

    document.getElementById("pctA").innerText = "—";
    document.getElementById("pctR").innerText = "—";
    document.getElementById("pctV").innerText = "—";


    /* 100% NA 2ª COR */

    if (cor === "A") {

        document.getElementById("fillA").style.width =
            "100%";

        document.getElementById("pctA").innerText =
            "100%";
    }

    if (cor === "R") {

        document.getElementById("fillR").style.width =
            "100%";

        document.getElementById("pctR").innerText =
            "100%";
    }

    if (cor === "V") {

        document.getElementById("fillV").style.width =
            "100%";

        document.getElementById("pctV").innerText =
            "100%";
    }
}


/* ================================
   LIMPAR
================================ */

function limparResultado() {

    document.getElementById("sequencia").innerText =
        "----";

    document.getElementById("proxima").innerText =
        "PRÓXIMA: -";

    document.getElementById("proxima").className =
        "proxima";


    document.getElementById("fillA").style.width =
        "0%";

    document.getElementById("fillR").style.width =
        "0%";

    document.getElementById("fillV").style.width =
        "0%";


    document.getElementById("pctA").innerText = "—";
    document.getElementById("pctR").innerText = "—";
    document.getElementById("pctV").innerText = "—";
}


/* ================================
   RESET
================================ */

function resetar() {

    historico = [];

    document.getElementById("historico").innerHTML = "";

    document.getElementById("analise").innerHTML = "";

    limparResultado();
}


/* ================================
   MOSTRAR PADRÕES
================================ */

function mostrarPadroes() {

    var caixa =
        document.getElementById("padroes");

    if (caixa.style.display === "block") {

        caixa.style.display = "none";

        return;
    }


    var lista =
        document.getElementById("lista");

    lista.innerHTML = "";


    var cores = ["A", "R", "V"];


    for (var i = 0; i < cores.length; i++) {

        for (var j = 0; j < cores.length; j++) {

            var x = cores[i];
            var y = cores[j];

            var seq;

            if (x === y) {
                seq = x + x + x + x;
            } else {
                seq = x + x + y + y;
            }


            var linha =
                document.createElement("div");

            linha.className = "padrao";


            for (var k = 0; k < 4; k++) {

                var mini =
                    document.createElement("div");

                mini.className =
                    "mini " +
                    seq.charAt(k).toLowerCase();

                linha.appendChild(mini);
            }


            var texto =
                document.createElement("strong");

            texto.innerText =
                seq + " → " + nomes[x];


            linha.appendChild(texto);

            lista.appendChild(linha);
        }
    }


    caixa.style.display = "block";
}

</script>

</body>
</html>
