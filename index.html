<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analisador V/A/R — Sistema de Padrões</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0f172a;
    --panel:#111827;
    --card:#020617;
    --border:#334155;
    --border2:#475569;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --blue:#2563eb;
    --green:#22c55e;
    --yellow:#f59e0b;
    --red:#ef4444;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

.container{
    width:min(1100px,94%);
    margin:auto;
    padding:20px 0 40px;
}

.header{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header h1{
    font-size:26px;
    margin-bottom:8px;
}

.header p{
    color:var(--muted);
}

.panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.panel h2{
    font-size:19px;
    margin-bottom:14px;
}

.input-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:220px;
    background:var(--card);
    border:1px solid var(--border2);
    color:white;
    padding:14px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    letter-spacing:4px;
    text-transform:uppercase;
    outline:none;
}

input:focus{
    border-color:#60a5fa;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    transform:translateY(-1px);
}

button:active{
    transform:scale(.98);
}

.btn-buscar{
    background:var(--blue);
    color:white;
}

.btn-limpar{
    background:#475569;
    color:white;
}

.quick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

.quick button{
    background:#1e293b;
    color:#cbd5e1;
    border:1px solid var(--border2);
    padding:8px 11px;
}

.quick button:hover{
    background:#334155;
}

.resultado{
    display:none;
    margin-top:18px;
    padding:22px;
    border-radius:14px;
    background:var(--card);
    border:1px solid var(--border);
    text-align:center;
}

.resultado .sequencia{
    font-size:36px;
    font-weight:bold;
    letter-spacing:8px;
    margin-bottom:8px;
}

.resultado-letra{
    font-size:58px;
    font-weight:bold;
}

.descricao{
    color:var(--muted);
    margin-top:8px;
}

.estado-v{
    color:var(--green);
}

.estado-a{
    color:var(--yellow);
}

.estado-r{
    color:var(--red);
}

.erro{
    color:#f87171;
}

.filtros{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.filtros button{
    background:#1e293b;
    color:#cbd5e1;
    border:1px solid var(--border2);
}

.filtros button.ativo{
    background:var(--blue);
    color:white;
    border-color:var(--blue);
}

.estatisticas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
}

.stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:25px;
    margin-bottom:4px;
}

.stat span{
    color:var(--muted);
    font-size:12px;
}

.contador{
    color:var(--muted);
    margin-bottom:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(125px,1fr));
    gap:9px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px;
    text-align:center;
    cursor:pointer;
    transition:.15s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#64748b;
}

.card .seq{
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
}

.card .res{
    font-size:25px;
    font-weight:bold;
    margin-top:6px;
}

.historico{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.hist-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:1px solid var(--border);
    padding:11px 13px;
    border-radius:10px;
    cursor:pointer;
}

.hist-item:hover{
    border-color:#64748b;
}

.hist-seq{
    font-weight:bold;
    letter-spacing:2px;
}

.hist-res{
    font-weight:bold;
    font-size:20px;
}

.vazio{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.status{
    margin-top:14px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    background:var(--card);
    border:1px solid var(--border);
}

.status.ok{
    border-color:#166534;
    color:#86efac;
}

.status.erro{
    border-color:#991b1b;
    color:#fca5a5;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:12px;
    line-height:1.6;
    margin-top:20px;
}

@media(max-width:700px){

    .estatisticas{
        grid-template-columns:repeat(2,1fr);
    }

    .input-area{
        flex-direction:column;
    }

    input,
    .input-area button{
        width:100%;
    }
}

@media(max-width:400px){

    .header h1{
        font-size:21px;
    }

    .resultado .sequencia{
        font-size:27px;
    }

    .resultado-letra{
        font-size:48px;
    }

    .grid{
        grid-template-columns:repeat(3,1fr);
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
    <h1>ANALISADOR DE PADRÕES V/A/R</h1>
    <p>Busca • Análise • Consulta de padrões</p>
</header>


<!-- =====================================================
     PESQUISA
===================================================== -->

<section class="panel">

    <h2>Pesquisar sequência</h2>

    <div class="input-area">

        <input
            id="entrada"
            maxlength="4"
            autocomplete="off"
            spellcheck="false"
            placeholder="AAAA"
            aria-label="Digite uma sequência"
        >

        <button
            type="button"
            class="btn-buscar"
            id="btnBuscar"
        >
            BUSCAR
        </button>

        <button
            type="button"
            class="btn-limpar"
            id="btnLimpar"
        >
            LIMPAR
        </button>

    </div>


    <div class="quick">

        <button data-seq="AAAA">AAAA</button>
        <button data-seq="AAAR">AAAR</button>
        <button data-seq="AAAV">AAAV</button>
        <button data-seq="AARA">AARA</button>
        <button data-seq="AAVV">AAVV</button>
        <button data-seq="ARAA">ARAA</button>
        <button data-seq="ARRR">ARRR</button>
        <button data-seq="AVAV">AVAV</button>
        <button data-seq="RAAA">RAAA</button>
        <button data-seq="RRRR">RRRR</button>
        <button data-seq="RRRV">RRRV</button>
        <button data-seq="RVRA">RVRA</button>
        <button data-seq="VAAA">VAAA</button>
        <button data-seq="VRRR">VRRR</button>
        <button data-seq="VVVV">VVVV</button>

    </div>


    <div
        id="resultado"
        class="resultado"
        aria-live="polite"
    >

        <div
            id="resultadoSequencia"
            class="sequencia"
        ></div>

        <div
            id="resultadoLetra"
            class="resultado-letra"
        ></div>

        <div
            id="resultadoDescricao"
            class="descricao"
        ></div>

    </div>

</section>


<!-- =====================================================
     PADRÕES
===================================================== -->

<section class="panel">

    <h2>Mostrar padrões</h2>


    <div class="estatisticas">

        <div class="stat">
            <strong id="total">0</strong>
            <span>TOTAL</span>
        </div>

        <div class="stat">
            <strong id="totalV" class="estado-v">0</strong>
            <span>RESULTADO V</span>
        </div>

        <div class="stat">
            <strong id="totalA" class="estado-a">0</strong>
            <span>RESULTADO A</span>
        </div>

        <div class="stat">
            <strong id="totalR" class="estado-r">0</strong>
            <span>RESULTADO R</span>
        </div>

    </div>


    <div class="filtros">

        <button
            class="ativo"
            data-filtro="TODOS"
        >
            TODOS
        </button>

        <button data-filtro="V">
            RESULTADO V
        </button>

        <button data-filtro="A">
            RESULTADO A
        </button>

        <button data-filtro="R">
            RESULTADO R
        </button>

    </div>


    <div
        id="contador"
        class="contador"
    ></div>


    <div
        id="listaPadroes"
        class="grid"
    ></div>


    <div
        id="statusTabela"
        class="status"
    ></div>

</section>


<!-- =====================================================
     HISTÓRICO
===================================================== -->

<section class="panel">

    <h2>Últimas consultas</h2>

    <div
        id="historico"
        class="historico"
    ></div>

</section>


<footer class="footer">

    Sistema de consulta de padrões V/A/R.<br>

    A tabela de regras é a fonte oficial dos resultados apresentados.

</footer>

</div>


<script>

/* =========================================================
   TABELA OFICIAL DE PADRÕES
========================================================= */

const padroesDefinidos = [

    {sequencia:"AAAA", resultado:"V"},
    {sequencia:"AAAR", resultado:"A"},
    {sequencia:"AAAV", resultado:"R"},

    {sequencia:"AARA", resultado:"R"},
    {sequencia:"AARR", resultado:"A"},
    {sequencia:"AARV", resultado:"R"},

    {sequencia:"AAVA", resultado:"V"},
    {sequencia:"AAVR", resultado:"V"},
    {sequencia:"AAVV", resultado:"V"},

    {sequencia:"ARAA", resultado:"A"},
    {sequencia:"ARAR", resultado:"A"},
    {sequencia:"ARAV", resultado:"A"},

    {sequencia:"ARRA", resultado:"R"},
    {sequencia:"ARRR", resultado:"R"},
    {sequencia:"ARRV", resultado:"R"},

    {sequencia:"ARVA", resultado:"V"},
    {sequencia:"ARVR", resultado:"V"},
    {sequencia:"ARVV", resultado:"V"},

    {sequencia:"AVAA", resultado:"V"},
    {sequencia:"AVAR", resultado:"V"},
    {sequencia:"AVAV", resultado:"V"},

    {sequencia:"AVRA", resultado:"V"},
    {sequencia:"AVRR", resultado:"V"},
    {sequencia:"AVRV", resultado:"V"},

    {sequencia:"AVVA", resultado:"V"},
    {sequencia:"AVVR", resultado:"V"},
    {sequencia:"AVVV", resultado:"V"},


    {sequencia:"RAAA", resultado:"A"},
    {sequencia:"RAAR", resultado:"A"},
    {sequencia:"RAAV", resultado:"A"},

    {sequencia:"RARA", resultado:"R"},
    {sequencia:"RARR", resultado:"R"},
    {sequencia:"RARV", resultado:"R"},

    {sequencia:"RAVA", resultado:"V"},
    {sequencia:"RAVR", resultado:"V"},
    {sequencia:"RAVV", resultado:"V"},

    {sequencia:"RRAA", resultado:"A"},
    {sequencia:"RRAR", resultado:"A"},
    {sequencia:"RRAV", resultado:"A"},

    {sequencia:"RRRA", resultado:"V"},
    {sequencia:"RRRR", resultado:"V"},
    {sequencia:"RRRV", resultado:"A"},

    {sequencia:"RRVA", resultado:"A"},
    {sequencia:"RRVR", resultado:"A"},
    {sequencia:"RRVV", resultado:"A"},

    {sequencia:"RVAA", resultado:"A"},
    {sequencia:"RVAR", resultado:"A"},
    {sequencia:"RVAV", resultado:"A"},

    {sequencia:"RVRA", resultado:"R"},
    {sequencia:"RVRR", resultado:"A"},
    {sequencia:"RVRV", resultado:"A"},

    {sequencia:"RVVA", resultado:"A"},
    {sequencia:"RVVR", resultado:"A"},
    {sequencia:"RVVV", resultado:"A"},


    {sequencia:"VAAA", resultado:"V"},
    {sequencia:"VAAR", resultado:"V"},
    {sequencia:"VAAV", resultado:"V"},

    {sequencia:"VARA", resultado:"R"},
    {sequencia:"VARR", resultado:"R"},
    {sequencia:"VARV", resultado:"R"},

    {sequencia:"VAVA", resultado:"V"},
    {sequencia:"VAVR", resultado:"V"},
    {sequencia:"VAVV", resultado:"V"},

    {sequencia:"VRAA", resultado:"R"},
    {sequencia:"VRAR", resultado:"R"},
    {sequencia:"VRAV", resultado:"R"},

    {sequencia:"VRRA", resultado:"R"},
    {sequencia:"VRRR", resultado:"R"},
    {sequencia:"VRRV", resultado:"R"},

    {sequencia:"VRVA", resultado:"V"},
    {sequencia:"VRVR", resultado:"V"},
    {sequencia:"VRVV", resultado:"V"},

    {sequencia:"VVAA", resultado:"V"},
    {sequencia:"VVAR", resultado:"V"},
    {sequencia:"VVAV", resultado:"V"},

    {sequencia:"VVRA", resultado:"V"},
    {sequencia:"VVRR", resultado:"V"},
    {sequencia:"VVRV", resultado:"V"},

    {sequencia:"VVVA", resultado:"V"},
    {sequencia:"VVVR", resultado:"V"},
    {sequencia:"VVVV", resultado:"V"}

];


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id => document.getElementById(id);

const entrada = $("entrada");
const resultado = $("resultado");
const resultadoSequencia = $("resultadoSequencia");
const resultadoLetra = $("resultadoLetra");
const resultadoDescricao = $("resultadoDescricao");
const listaPadroes = $("listaPadroes");
const contador = $("contador");
const historicoEl = $("historico");
const statusTabela = $("statusTabela");


/* =========================================================
   ÍNDICE DE BUSCA
   BUSCA O PADRÃO EM TEMPO CONSTANTE
========================================================= */

const indicePadroes = new Map();

for(const item of padroesDefinidos){
    indicePadroes.set(item.sequencia, item);
}


/* =========================================================
   VALIDAÇÃO DA TABELA
========================================================= */

function validarTabela(){

    const duplicados = [];
    const vistos = new Set();

    for(const item of padroesDefinidos){

        if(vistos.has(item.sequencia)){
            duplicados.push(item.sequencia);
        }

        vistos.add(item.sequencia);
    }


    const esperados = [];

    for(const a of ["A","R","V"]){
        for(const b of ["A","R","V"]){
            for(const c of ["A","R","V"]){
                for(const d of ["A","R","V"]){

                    esperados.push(a+b+c+d);

                }
            }
        }
    }


    const faltantes = esperados.filter(
        seq => !vistos.has(seq)
    );


    if(duplicados.length){

        statusTabela.className =
            "status erro";

        statusTabela.textContent =
            "ERRO: existem padrões duplicados: " +
            duplicados.join(", ");

        return false;
    }


    if(faltantes.length){

        statusTabela.className =
            "status erro";

        statusTabela.textContent =
            "ATENÇÃO: faltam " +
            faltantes.length +
            " combinações: " +
            faltantes.join(", ");

        return false;
    }


    statusTabela.className =
        "status ok";

    statusTabela.textContent =
        "✓ Tabela validada: " +
        padroesDefinidos.length +
        " combinações sem duplicação.";

    return true;
}


/* =========================================================
   NORMALIZAÇÃO
========================================================= */

function normalizar(valor){

    return String(valor)
        .toUpperCase()
        .replace(/[^ARV]/g,"")
        .slice(0,4);

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(item){

    resultado.style.display = "block";

    resultadoSequencia.textContent =
        item.sequencia;

    resultadoLetra.textContent =
        item.resultado;

    resultadoLetra.className =
        "resultado-letra estado-" +
        item.resultado.toLowerCase();

    resultadoDescricao.textContent =
        "Resultado encontrado na tabela de padrões.";

}


/* =========================================================
   MOSTRAR ERRO
========================================================= */

function mostrarErro(mensagem){

    resultado.style.display = "block";

    resultadoSequencia.textContent =
        "ATENÇÃO";

    resultadoLetra.textContent =
        "—";

    resultadoLetra.className =
        "resultado-letra erro";

    resultadoDescricao.textContent =
        mensagem;

}


/* =========================================================
   BUSCA PRINCIPAL
========================================================= */

function buscar(){

    const sequencia =
        normalizar(entrada.value);

    entrada.value = sequencia;


    if(sequencia.length !== 4){

        mostrarErro(
            "Digite exatamente 4 caracteres usando somente A, R ou V."
        );

        return;
    }


    /*
       Busca direta pelo Map.
       Não usa Array.find().
    */

    const item =
        indicePadroes.get(sequencia);


    if(!item){

        mostrarErro(
            "Essa sequência não está cadastrada na tabela."
        );

        return;
    }


    mostrarResultado(item);

    adicionarHistorico(item);

}


/* =========================================================
   LIMPAR
========================================================= */

function limpar(){

    entrada.value = "";

    resultado.style.display = "none";

    entrada.focus();

}


/* =========================================================
   CONSULTA RÁPIDA
========================================================= */

function usar(sequencia){

    entrada.value = sequencia;

    buscar();

}


/* =========================================================
   ESTATÍSTICAS
========================================================= */

function atualizarEstatisticas(){

    let v = 0;
    let a = 0;
    let r = 0;


    for(const item of padroesDefinidos){

        if(item.resultado === "V") v++;
        else if(item.resultado === "A") a++;
        else if(item.resultado === "R") r++;

    }


    $("total").textContent =
        padroesDefinidos.length;

    $("totalV").textContent = v;
    $("totalA").textContent = a;
    $("totalR").textContent = r;

}


/* =========================================================
   RENDERIZAÇÃO DOS PADRÕES
========================================================= */

function renderizarPadroes(tipo="TODOS"){

    listaPadroes.replaceChildren();


    const lista =
        tipo === "TODOS"
            ? padroesDefinidos
            : padroesDefinidos.filter(
                item => item.resultado === tipo
            );


    contador.textContent =
        `${lista.length} padrão(s) exibido(s) de ${padroesDefinidos.length}.`;


    const fragment =
        document.createDocumentFragment();


    for(const item of lista){

        const card =
            document.createElement("div");

        card.className = "card";

        card.dataset.sequencia =
            item.sequencia;


        const seq =
            document.createElement("div");

        seq.className = "seq";

        seq.textContent =
            item.sequencia;


        const res =
            document.createElement("div");

        res.className =
            "res estado-" +
            item.resultado.toLowerCase();

        res.textContent =
            item.resultado;


        card.append(seq,res);

        fragment.appendChild(card);

    }


    listaPadroes.appendChild(fragment);

}


/* =========================================================
   FILTROS
========================================================= */

document
    .querySelector(".filtros")
    .addEventListener("click", event => {

        const botao =
            event.target.closest("button");

        if(!botao) return;


        document
            .querySelectorAll(".filtros button")
            .forEach(b =>
                b.classList.remove("ativo")
            );


        botao.classList.add("ativo");


        renderizarPadroes(
            botao.dataset.filtro
        );

    });


/* =========================================================
   HISTÓRICO
========================================================= */

const CHAVE_HISTORICO =
    "historico_var_v1";

let historicoDados =
    JSON.parse(
        localStorage.getItem(CHAVE_HISTORICO) || "[]"
    );


function salvarHistorico(){

    localStorage.setItem(
        CHAVE_HISTORICO,
        JSON.stringify(historicoDados)
    );

}


function adicionarHistorico(item){

    historicoDados =
        historicoDados.filter(
            h =>
                h.sequencia !== item.sequencia
        );


    historicoDados.unshift({

        sequencia:item.sequencia,

        resultado:item.resultado

    });


    historicoDados =
        historicoDados.slice(0,10);


    salvarHistorico();

    renderizarHistorico();

}


/* =========================================================
   RENDERIZAR HISTÓRICO
========================================================= */

function renderizarHistorico(){

    historicoEl.replaceChildren();


    if(!historicoDados.length){

        const vazio =
            document.createElement("div");

        vazio.className = "vazio";

        vazio.textContent =
            "Nenhuma consulta realizada.";

        historicoEl.appendChild(vazio);

        return;
    }


    const fragment =
        document.createDocumentFragment();


    for(const item of historicoDados){

        const linha =
            document.createElement("div");

        linha.className =
            "hist-item";

        linha.dataset.sequencia =
            item.sequencia;


        const seq =
            document.createElement("span");

        seq.className =
            "hist-seq";

        seq.textContent =
            item.sequencia;


        const res =
            document.createElement("span");

        res.className =
            "hist-res estado-" +
            item.resultado.toLowerCase();

        res.textContent =
            item.resultado;


        linha.append(seq,res);

        fragment.appendChild(linha);

    }


    historicoEl.appendChild(fragment);

}


/* =========================================================
   CLIQUE NO HISTÓRICO
========================================================= */

historicoEl.addEventListener(
    "click",
    event => {

        const item =
            event.target.closest(".hist-item");

        if(!item) return;


        usar(
            item.dataset.sequencia
        );

    }
);


/* =========================================================
   CLIQUE NOS PADRÕES
========================================================= */

listaPadroes.addEventListener(
    "click",
    event => {

        const card =
            event.target.closest(".card");

        if(!card) return;


        usar(
            card.dataset.sequencia
        );

    }
);


/* =========================================================
   BOTÕES RÁPIDOS
========================================================= */

document
    .querySelector(".quick")
    .addEventListener("click", event => {

        const botao =
            event.target.closest("button");

        if(!botao) return;


        usar(
            botao.dataset.seq
        );

    });


/* =========================================================
   BOTÃO BUSCAR
========================================================= */

$("btnBuscar").addEventListener(
    "click",
    buscar
);


/* =========================================================
   BOTÃO LIMPAR
========================================================= */
