<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator — IA Padrões</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#0d0d0d;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:20px;
}

h1{
    margin:0 0 8px;
    font-size:30px;
}

.subtitulo{
    color:#aaa;
    margin-bottom:20px;
}

.card{
    background:#151515;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #202020;
}

h2{
    margin:0 0 15px;
    font-size:22px;
}


/* =========================================================
   BOTÕES
========================================================= */

.botoes{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:16px 25px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    min-width:150px;
}

.btn:active{
    opacity:.75;
}

.azul{
    background:#286cf0;
}

.roxo{
    background:#8b24f5;
}

.vermelho{
    background:#f442a4;
}

.btn-reset{
    background:#286cf0;
}

.btn-padroes{
    background:#ffd21c;
    color:#111;
}


/* =========================================================
   HISTÓRICO
========================================================= */

.historico{
    min-height:92px;
    background:#080f13;
    border-radius:12px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.bolinha{
    width:56px;
    height:56px;
    border-radius:10px;
}


/* =========================================================
   LEGENDA
========================================================= */

.legenda{
    color:#aaa;
    font-size:18px;
    margin-top:10px;
}


/* =========================================================
   SEQUÊNCIA
========================================================= */

.sequencia-box{
    background:#080d12;
    border-radius:14px;
    padding:20px;
    margin-top:20px;
    line-height:1.8;
    font-size:19px;
}

.sequencia{
    font-weight:bold;
}

.resultado{
    margin-top:18px;
    font-size:21px;
    font-weight:bold;
}

.regra{
    color:#aaa;
    font-size:17px;
    margin-top:5px;
}


/* =========================================================
   PREVISÃO
========================================================= */

.previsao{
    background:#080f13;
    border-radius:12px;
    padding:25px;
    text-align:center;
    margin-bottom:22px;
}

.previsao-titulo{
    color:#aaa;
    font-size:17px;
    margin-bottom:10px;
}

.previsao-seq{
    font-size:27px;
    font-weight:bold;
}

.previsao-cor{
    font-size:38px;
    font-weight:bold;
    margin-top:8px;
}

.previsao-cor.azul-texto{
    color:#286cf0;
}

.previsao-cor.roxo-texto{
    color:#8b24f5;
}

.previsao-cor.vermelho-texto{
    color:#f442a4;
}


/* =========================================================
   BARRAS
========================================================= */

.barra-item{
    margin-bottom:18px;
}

.barra-topo{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    margin-bottom:5px;
}

.barra{
    height:26px;
    background:#242424;
    border-radius:15px;
    overflow:hidden;
}

.barra-fill{
    height:100%;
    width:0%;
    border-radius:15px;
    transition:width .3s ease;
}

.fill-azul{
    background:#286cf0;
}

.fill-roxo{
    background:#8b24f5;
}

.fill-vermelho{
    background:#f442a4;
}


/* =========================================================
   SEM REGRA
========================================================= */

.sem-regra{
    color:#aaa;
    text-align:center;
    padding:20px;
}


/* =========================================================
   PADRÕES
========================================================= */

#listaPadroes{
    display:none;
}

.padrao{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding:8px;
    border-radius:8px;
}

.padrao:hover{
    background:#1d1d1d;
}

.mini{
    width:28px;
    height:28px;
    border-radius:6px;
}


/* =========================================================
   STATUS
========================================================= */

.status-tabela{
    margin-top:15px;
    padding:12px;
    background:#080f13;
    border-radius:10px;
    color:#aaa;
    font-size:14px;
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:600px){

    .container{
        padding:14px;
    }

    h1{
        font-size:25px;
    }

    .card{
        padding:16px;
    }

    .btn{
        min-width:0;
        flex:1;
        padding:15px 10px;
        font-size:16px;
    }

    .bolinha{
        width:56px;
        height:56px;
    }

    .sequencia-box{
        font-size:17px;
    }

    .previsao-cor{
        font-size:32px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>Aviator — IA Padrões</h1>

    <div class="subtitulo">
        Análise determinística pela posição das cores
    </div>


    <!-- =====================================================
         CONTROLE
    ====================================================== -->

    <div class="card">

        <div class="botoes">

            <button
                class="btn btn-reset"
                onclick="resetHist()">

                Reset

            </button>


            <button
                class="btn btn-padroes"
                onclick="mostrarPadroes()">

                Mostrar padrões

            </button>

        </div>


        <!-- HISTÓRICO -->

        <div
            id="historico"
            class="historico">
        </div>


        <!-- BOTÕES DE CORES -->

        <div
            class="botoes"
            style="margin-top:18px;">

            <button
                class="btn azul"
                onclick="clicarCor('A')">

                AZUL (A)

            </button>


            <button
                class="btn roxo"
                onclick="clicarCor('R')">

                ROXO (R)

            </button>


            <button
                class="btn vermelho"
                onclick="clicarCor('V')">

                VERMELHO (V)

            </button>

        </div>


        <div class="legenda">

            A = Azul |
            R = Roxo |
            V = Vermelho

        </div>


        <!-- ANÁLISE -->

        <div id="analise"></div>

    </div>


    <!-- =====================================================
         PRÓXIMA COR
    ====================================================== -->

    <div class="card">

        <h2>Próxima cor pela regra</h2>


        <div
            id="previsao"
            class="previsao">

            <div class="previsao-titulo">

                SEQUÊNCIA ANALISADA

            </div>


            <div
                id="previsaoSeq"
                class="previsao-seq">

                ----

            </div>


            <div
                id="previsaoCor"
                class="previsao-cor">

                PRÓXIMA: -

            </div>

        </div>


        <!-- AZUL -->

        <div class="barra-item">

            <div class="barra-topo">

                <span>AZUL</span>

                <span id="porcentagemA">—</span>

            </div>


            <div class="barra">

                <div
                    id="barraA"
                    class="barra-fill fill-azul">
                </div>

            </div>

        </div>


        <!-- ROXO -->

        <div class="barra-item">

            <div class="barra-topo">

                <span>ROXO</span>

                <span id="porcentagemR">—</span>

            </div>


            <div class="barra">

                <div
                    id="barraR"
                    class="barra-fill fill-roxo">
                </div>

            </div>

        </div>


        <!-- VERMELHO -->

        <div class="barra-item">

            <div class="barra-topo">

                <span>VERMELHO</span>

                <span id="porcentagemV">—</span>

            </div>


            <div class="barra">

                <div
                    id="barraV"
                    class="barra-fill fill-vermelho">
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         PADRÕES
    ====================================================== -->

    <div
        id="listaPadroes"
        class="card">

        <h2>Padrões XXYY</h2>

        <div id="padroesConteudo"></div>

        <div
            id="statusTabela"
            class="status-tabela">
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO DAS CORES
========================================================= */

const CORES = {

    A:{
        nome:"AZUL",
        classe:"azul",
        texto:"azul-texto"
    },

    R:{
        nome:"ROXO",
        classe:"roxo",
        texto:"roxo-texto"
    },

    V:{
        nome:"VERMELHO",
        classe:"vermelho",
        texto:"vermelho-texto"
    }

};


/* =========================================================
   TABELA DE PADRÕES
=========================================================

   IMPORTANTE:

   Esta tabela é a fonte da previsão.

   Cada sequência de 4 posições possui
   um resultado correspondente.

   Exemplo:

   AARR → A
   RRAA → R
   VVAA → V

========================================================= */

const padroesDefinidos = [

    {sequencia:"AAAA",resultado:"A"},
    {sequencia:"AAAR",resultado:"A"},
    {sequencia:"AAAV",resultado:"A"},

    {sequencia:"AARA",resultado:"R"},
    {sequencia:"AARR",resultado:"A"},
    {sequencia:"AARV",resultado:"R"},

    {sequencia:"AAVA",resultado:"V"},
    {sequencia:"AAVR",resultado:"V"},
    {sequencia:"AAVV",resultado:"V"},


    {sequencia:"ARAA",resultado:"A"},
    {sequencia:"ARAR",resultado:"A"},
    {sequencia:"ARAV",resultado:"A"},

    {sequencia:"ARRA",resultado:"R"},
    {sequencia:"ARRR",resultado:"R"},
    {sequencia:"ARRV",resultado:"R"},

    {sequencia:"ARVA",resultado:"V"},
    {sequencia:"ARVR",resultado:"V"},
    {sequencia:"ARVV",resultado:"V"},


    {sequencia:"AVAA",resultado:"A"},
    {sequencia:"AVAR",resultado:"A"},
    {sequencia:"AVAV",resultado:"A"},

    {sequencia:"AVRA",resultado:"R"},
    {sequencia:"AVRR",resultado:"R"},
    {sequencia:"AVRV",resultado:"R"},

    {sequencia:"AVVA",resultado:"V"},
    {sequencia:"AVVR",resultado:"V"},
    {sequencia:"AVVV",resultado:"V"},


    {sequencia:"RAAA",resultado:"R"},
    {sequencia:"RAAR",resultado:"R"},
    {sequencia:"RAAV",resultado:"R"},

    {sequencia:"RARA",resultado:"A"},
    {sequencia:"RARR",resultado:"R"},
    {sequencia:"RARV",resultado:"R"},

    {sequencia:"RAVA",resultado:"V"},
    {sequencia:"RAVR",resultado:"V"},
    {sequencia:"RAVV",resultado:"V"},


    {sequencia:"RRAA",resultado:"R"},
    {sequencia:"RRAR",resultado:"R"},
    {sequencia:"RRAV",resultado:"R"},

    {sequencia:"RRRA",resultado:"R"},
    {sequencia:"RRRR",resultado:"R"},
    {sequencia:"RRRV",resultado:"R"},

    {sequencia:"RRVA",resultado:"A"},
    {sequencia:"RRVR",resultado:"R"},
    {sequencia:"RRVV",resultado:"R"},


    {sequencia:"RVAA",resultado:"R"},
    {sequencia:"RVAR",resultado:"R"},
    {sequencia:"RVAV",resultado:"R"},

    {sequencia:"RVRA",resultado:"A"},
    {sequencia:"RVRR",resultado:"R"},
    {sequencia:"RVRV",resultado:"R"},

    {sequencia:"RVVA",resultado:"A"},
    {sequencia:"RVVR",resultado:"R"},
    {sequencia:"RVVV",resultado:"R"},


    {sequencia:"VAAA",resultado:"V"},
    {sequencia:"VAAR",resultado:"V"},
    {sequencia:"VAAV",resultado:"V"},

    {sequencia:"VARA",resultado:"R"},
    {sequencia:"VARR",resultado:"R"},
    {sequencia:"VARV",resultado:"R"},

    {sequencia:"VAVA",resultado:"V"},
    {sequencia:"VAVR",resultado:"V"},
    {sequencia:"VAVV",resultado:"V"},


    {sequencia:"VRAA",resultado:"R"},
    {sequencia:"VRAR",resultado:"R"},
    {sequencia:"VRAV",resultado:"R"},

    {sequencia:"VRRA",resultado:"R"},
    {sequencia:"VRRR",resultado:"R"},
    {sequencia:"VRRV",resultado:"R"},

    {sequencia:"VRVA",resultado:"V"},
    {sequencia:"VRVR",resultado:"V"},
    {sequencia:"VRVV",resultado:"V"},


    {sequencia:"VVAA",resultado:"V"},
    {sequencia:"VVAR",resultado:"V"},
    {sequencia:"VVAV",resultado:"V"},

    {sequencia:"VVRA",resultado:"V"},
    {sequencia:"VVRR",resultado:"V"},
    {sequencia:"VVRV",resultado:"V"},

    {sequencia:"VVVA",resultado:"V"},
    {sequencia:"VVVR",resultado:"V"},
    {sequencia:"VVVV",resultado:"V"}

];


/* =========================================================
   ÍNDICE DE BUSCA
========================================================= */

const indicePadroes = new Map();

padroesDefinidos.forEach(item => {

    indicePadroes.set(
        item.sequencia,
        item.resultado
    );

});


/* =========================================================
   HISTÓRICO
========================================================= */

let historico = [];


/* =========================================================
   CLICAR NA COR
========================================================= */

function clicarCor(cor){

    if(!CORES[cor]){
        return;
    }


    historico.push(cor);


    /*
       Mantém as últimas 20 cores.
    */

    if(historico.length > 20){

        historico.shift();

    }


    atualizarHistorico();

    analisar();

}


/* =========================================================
   MOSTRAR HISTÓRICO
========================================================= */

function atualizarHistorico(){

    const elemento =
        document.getElementById("historico");


    elemento.replaceChildren();


    historico.forEach(cor => {

        const div =
            document.createElement("div");


        div.className =
            "bolinha " +
            CORES[cor].classe;


        div.title =
            CORES[cor].nome;


        elemento.appendChild(div);

    });

}


/* =========================================================
   BUSCA DO PADRÃO
========================================================= */

function buscarPadrao(sequencia){

    return indicePadroes.get(sequencia) || null;

}


/* =========================================================
   ANALISAR ÚLTIMAS 4 CORES
========================================================= */

function analisar(){

    const elemento =
        document.getElementById("analise");


    /*
       Ainda não existem 4 cores.
    */

    if(historico.length < 4){

        const faltam =
            4 - historico.length;


        elemento.innerHTML = `

            <div class="sequencia-box">

                Ainda faltam
                <strong>${faltam}</strong>
                cor(es) para formar uma sequência de 4.

            </div>

        `;


        limparPrevisao();

        return;

    }


    /*
       SOMENTE AS ÚLTIMAS 4
    */

    const ultimas4 =
        historico.slice(-4);


    const sequencia =
        ultimas4.join("");


    /*
       CONSULTA EXATA NA TABELA
    */

    const resultado =
        buscarPadrao(sequencia);


    const nomes =
        ultimas4.map(
            cor => CORES[cor].nome
        );


    /*
       PADRÃO ENCONTRADO
    */

    if(resultado){

        const info =
            CORES[resultado];


        elemento.innerHTML = `

            <div class="sequencia-box">

                <div>

                    Sequência:
                    <strong>${sequencia}</strong>

                </div>


                <div>

                    1ª: ${nomes[0]}
                    |
                    2ª: ${nomes[1]}
                    |
                    3ª: ${nomes[2]}
                    |
                    4ª: ${nomes[3]}

                </div>


                <div class="resultado">

                    PRÓXIMA COR:
                    ${info.nome}

                </div>


                <div class="regra">

                    Regra encontrada na tabela:
                    <strong>
                        ${sequencia} → ${resultado}
                    </strong>

                </div>

            </div>

        `;


        mostrarPrevisao(
            sequencia,
            resultado
        );


        return;

    }


    /*
       NÃO ENCONTRADO
    */

    elemento.innerHTML = `

        <div class="sequencia-box">

            <div>

                Sequência:
                <strong>${sequencia}</strong>

            </div>


            <div class="resultado">

                PRÓXIMA COR: NÃO DEFINIDA

            </div>


            <div class="regra">

                Essa sequência não possui
                resultado cadastrado.

            </div>

        </div>

    `;


    limparPrevisao();

}


/* =========================================================
   MOSTRAR PREVISÃO
========================================================= */

function mostrarPrevisao(
    sequencia,
    cor
){

    const info =
        CORES[cor];


    document.getElementById(
        "previsaoSeq"
    ).textContent =
        sequencia;


    const previsao =
        document.getElementById(
            "previsaoCor"
        );


    previsao.textContent =
        "PRÓXIMA: " + info.nome;


    previsao.className =
        "previsao-cor " +
        info.texto;


    /*
       ZERA BARRAS
    */

    resetBarras();


    /*
       A barra representa
       a previsão determinística
       da tabela.

       Não é uma probabilidade estatística.
    */

    const barra =
        document.getElementById(
            "barra" + cor
        );


    const porcentagem =
        document.getElementById(
            "porcentagem" + cor
        );


    if(barra && porcentagem){

        barra.style.width =
            "100%";

        porcentagem.textContent =
            "100%";

    }

}


/* =========================================================
   RESET BARRAS
========================================================= */

function resetBarras(){

    ["A","R","V"].forEach(cor => {

        const barra =
            document.getElementById(
                "barra" + cor
            );


        const porcentagem =
            document.getElementById(
                "porcentagem" + cor
            );


        barra.style.width =
            "0%";


        porcentagem.textContent =
            "—";

    });

}


/* =========================================================
   LIMPAR PREVISÃO
========================================================= */

function limparPrevisao(){

    document.getElementById(
        "previsaoSeq"
    ).textContent =
        "----";


    const previsao =
        document.getElementById(
            "previsaoCor"
        );


    previsao.textContent =
        "PRÓXIMA: NÃO DEFINIDA";


    previsao.className =
        "previsao-cor";


    resetBarras();

}


/* =========================================================
   RESET HISTÓRICO
========================================================= */

function resetHist(){

    historico = [];


    atualizarHistorico();


    document.getElementById(
        "analise"
    ).replaceChildren();


    limparPrevisao();

}


/* =========================================================
   GERAR TODAS AS COMBINAÇÕES
========================================================= */

function gerarCombinacoes(){

    const resultado = [];


    const cores = [
        "A",
        "R",
        "V"
    ];


    for(const a of cores){

        for(const b of cores){

            for(const c of cores){

                for(const d of cores){

                    resultado.push(
                        a+b+c+d
                    );

                }

            }

        }

    }


    return resultado;

}


/* =========================================================
   VALIDAR TABELA
========================================================= */

function validarTabela(){

    const esperados =
        gerarCombinacoes();


    const existentes =
        new Set(
            padroesDefinidos.map(
                item => item.sequencia
            )
        );


    const duplicados = [];


    const controle =
        new Set();


    padroesDefinidos.forEach(item => {

        if(controle.has(item.sequencia)){

            duplicados.push(
                item.sequencia
            );

        }


        controle.add(
            item.sequencia
        );

    });


    const faltantes =
        esperados.filter(
            seq => !existentes.has(seq)
        );


    const status =
        document.getElementById(
            "statusTabela"
        );


    if(
        duplicados.length === 0 &&
        faltantes.length === 0 &&
        padroesDefinidos.length === 81
    ){

        status.textContent =
            "✓ Tabela completa: 81 sequências cadastradas, sem duplicações.";

        return true;

    }


    let mensagem =
        "ATENÇÃO: tabela incompleta.";


    if(duplicados.length){

        mensagem +=
            " Duplicados: " +
            duplicados.join(", ") +
            ".";

    }


    if(faltantes.length){

        mensagem +=
            " Faltando: " +
            faltantes.join(", ") +
            ".";

    }


    status.textContent =
        mensagem;


    return false;

}


/* =========================================================
   MOSTRAR PADRÕES
========================================================= */

function mostrarPadroes(){

    const caixa =
        document.getElementById(
            "listaPadroes"
        );


    /*
       Alterna abrir/fechar.
    */

    if(
        caixa.style.display === "block"
    ){

        caixa.style.display =
            "none";

        return;

    }


    const conteudo =
        document.getElementById(
            "padroesConteudo"
        );


    conteudo.replaceChildren();


    /*
       Mostra TODOS os padrões
       cadastrados na tabela.
    */

    padroesDefinidos.forEach(
        item => {

            adicionarPadrao(
                conteudo,
                item.sequencia,
                item.resultado
            );

        }
    );


    validarTabela();


    caixa.style.display =
        "block";

}


/* =========================================================
   ADICIONAR PADRÃO
========================================================= */

function adicionarPadrao(
    container,
    sequencia,
    resultado
){

    const div =
        document.createElement("div");


    div.className =
        "padrao";


    /*
       As quatro bolinhas.
    */

    for(
        const letra of sequencia
    ){

        const mini =
            document.createElement("div");


        mini.className =
            "mini " +
            CORES[letra].classe;


        mini.title =
            CORES[letra].nome;


        div.appendChild(
            mini
        );

    }


    /*
       Texto do padrão.
    */

    const texto =
        document.createElement("strong");


    texto.textContent =
        `${sequencia} → ${CORES[resultado].nome}`;


    div.appendChild(
        texto
    );


    container.appendChild(
        div
    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

atualizarHistorico();

limparPrevisao();

validarTabela();

</script>

</body>
</html>
