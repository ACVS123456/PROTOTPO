<style>
/* =========================================================
   ENQUADRAMENTO TIPO COMPUTADOR
   SOMENTE VISUAL — NÃO ALTERA A LÓGICA DA IA
   ========================================================= */

*{
    box-sizing:border-box;
}

html{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    zoom:1;
}

body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100vh;
    background:#101010;
    color:#f1f1f1;
    font-family:Arial,Helvetica,sans-serif;
    font-size:16px;
    overflow-x:hidden;
}

/* TELA PRINCIPAL */
.container{
    width:100%;
    max-width:1100px;
    min-height:100vh;
    margin:0 auto;
    padding:24px;
}

/* EVITA O EFEITO DE LUPA */
.container,
.container *{
    transform:none;
}

/* CABEÇALHO */
header{
    width:100%;
    margin-bottom:20px;
}

h1{
    margin:0 0 8px 0;
    font-size:28px;
    line-height:1.2;
}

p{
    line-height:1.5;
}

/* PAINÉIS */
.card,
.panel,
.section{
    width:100%;
    background:#151515;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    border:1px solid #202020;
}

/* BOTÕES */
button{
    border:0;
    border-radius:12px;
    padding:14px 22px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
    min-height:50px;
}

button:active{
    transform:scale(.98);
}

/* ÁREA DAS 4 CORES */
.history,
#history{
    width:100%;
    min-height:90px;
    background:#071017;
    border-radius:12px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:10px;
    overflow-x:auto;
}

/* QUADRADOS DAS CORES */
.color-box,
.history-item{
    width:56px;
    height:56px;
    min-width:56px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* BOTÕES DE COR */
.color-buttons{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:14px 0;
}

.color-buttons button{
    flex:1 1 200px;
}

/* AZUL */
.azul,
.blue{
    background:#2f6df6;
}

/* ROXO */
.roxo,
.purple{
    background:#8c27f5;
}

/* VERMELHO */
.vermelho,
.red{
    background:#f443a5;
}

/* TEXTO DA SEQUÊNCIA */
.sequence{
    width:100%;
    background:#070b0f;
    border-radius:12px;
    padding:20px;
    margin-top:15px;
    font-size:17px;
    line-height:1.6;
}

/* RESULTADO */
.prediction{
    width:100%;
    background:#071017;
    border-radius:14px;
    padding:22px;
    text-align:center;
    margin-top:15px;
}

.prediction h2{
    margin:8px 0;
    font-size:28px;
}

/* BARRAS */
.probability{
    width:100%;
    margin-top:18px;
}

.probability-row{
    width:100%;
    margin-bottom:14px;
}

.probability-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:17px;
    margin-bottom:5px;
}

.bar{
    width:100%;
    height:26px;
    background:#252525;
    border-radius:14px;
    overflow:hidden;
}

.bar-fill{
    height:100%;
    width:0;
    border-radius:14px;
    transition:width .25s ease;
}

/* CORES DAS BARRAS */
.bar-blue{
    background:#2f6df6;
}

.bar-purple{
    background:#8c27f5;
}

.bar-red{
    background:#f443a5;
}

/* BOTÕES SUPERIORES */
.top-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:18px;
}

.reset{
    background:#286cf0;
    color:white;
}

.patterns{
    background:#ffd21c;
    color:#111;
}

/* LEGENDA */
.legend{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    margin-top:12px;
    font-size:16px;
}

.legend span{
    display:flex;
    align-items:center;
    gap:7px;
}

.legend-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
}

/* =========================================================
   MODO COMPUTADOR / DESKTOP
   ========================================================= */

@media (min-width:900px){

    body{
        display:block;
    }

    .container{
        max-width:1180px;
        padding:30px;
    }

    .card,
    .panel,
    .section{
        padding:24px;
    }

    .prediction{
        padding:26px;
    }

    .prediction h2{
        font-size:32px;
    }

}

/* =========================================================
   CELULAR
   ========================================================= */

@media (max-width:899px){

    .container{
        width:100%;
        padding:14px;
    }

    h1{
        font-size:24px;
    }

    .card,
    .panel,
    .section{
        padding:16px;
        border-radius:14px;
    }

    .history,
    #history{
        min-height:82px;
        padding:14px;
    }

    .color-box,
    .history-item{
        width:52px;
        height:52px;
        min-width:52px;
    }

    .prediction h2{
        font-size:25px;
    }
}

/* CELULAR PEQUENO */
@media (max-width:480px){

    .container{
        padding:10px;
    }

    button{
        font-size:15px;
        padding:12px 16px;
    }

    .color-buttons{
        gap:7px;
    }

    .color-buttons button{
        flex:1 1 100%;
    }

    .prediction h2{
        font-size:23px;
    }
}
</style>
