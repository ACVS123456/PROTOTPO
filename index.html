<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Analisador de Padrões V/A/R</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    min-height:100vh;
}

.container{
    width:min(1100px,94%);
    margin:0 auto;
    padding:20px 0 40px;
}

.header{
    background:#111827;
    border:1px solid #334155;
    border-radius:18px;
    padding:24px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.header h1{
    font-size:26px;
    margin-bottom:8px;
}

.header p{
    color:#94a3b8;
}

.panel{
    background:#111827;
    border:1px solid #334155;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.panel h2{
    font-size:19px;
    margin-bottom:14px;
}

.input-area{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

input{
    flex:1;
    min-width:220px;
    background:#020617;
    border:1px solid #475569;
    color:#fff;
    padding:14px;
    border-radius:10px;
    font-size:17px;
    text-transform:uppercase;
    outline:none;
}

input:focus{
    border-color:#60a5fa;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

.btn-buscar{
    background:#2563eb;
    color:white;
}

.btn-limpar{
    background:#475569;
    color:white;
}

.resultado{
    margin-top:18px;
    display:none;
    padding:22px;
    border-radius:14px;
    background:#020617;
    border:1px solid #334155;
    text-align:center;
}

.resultado .sequencia{
    font-size:34px;
    font-weight:bold;
    letter-spacing:7px;
    margin-bottom:12px;
}

.resultado .resultado-letra{
    font-size:48px;
    font-weight:bold;
}

.resultado .descricao{
    color:#94a3b8;
    margin-top:8px;
}

.estado-v{
    color:#22c55e;
}

.estado-a{
    color:#f59e0b;
}

.estado-r{
    color:#ef4444;
}

.erro{
    color:#f87171;
    font-weight:bold;
}

.quick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

.quick button{
    background:#1e293b;
    color:#cbd5e1;
    border:1px solid #475569;
    padding:9px 12px;
}

.quick button:hover{
    background:#334155;
}

.filtros{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.filtros button{
    background:#1e293b;
    color:#cbd5e1;
    border:1px solid #475569;
}

.filtros button.ativo{
    background:#2563eb;
    color:white;
    border-color:#2563eb;
}

.contador{
    color:#94a3b8;
    margin-bottom:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    gap:9px;
}

.card{
    background:#020617;
    border:1px solid #334155;
    border-radius:12px;
    padding:13px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:#64748b;
}

.card .seq{
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
}

.card .res{
    font-size:24px;
    font-weight:bold;
    margin-top:6px;
}

.historico{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.hist-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#020617;
    border:1px solid #334155;
    padding:11px 13px;
    border-radius:10px;
}

.hist-seq{
    font-weight:bold;
    letter-spacing:2px;
}

.hist-res{
    font-weight:bold;
}

.vazio{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.footer{
    text-align:center;
    color:#64748b;
    font-size:12px;
    line-height:1.6;
    margin-top:20px;
}

@media(max-width:600px){
    .header h1{
        font-size:21px;
    }

    .input-area{
        flex-direction:column;
    }

    input,
    .input-area button{
        width:100%;
    }

    .resultado .sequencia{
        font-size:27px;
    }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
    <h1>ANALISADOR DE PADRÕES V/A/R</h1>
    <p>Busca • Análise • Consulta de padrões</p>
</header>


<section class="panel">

    <h2>Pesquisar sequência</h2>

    <div class="input-area">

        <input
            id="entrada"
            maxlength="4"
            autocomplete="off"
            placeholder="Digite uma sequência: AAAA"
        >

        <button class="btn-buscar" onclick="buscar()">
            BUSCAR
        </button>

        <button class="btn-limpar" onclick="limpar()">
            LIMPAR
        </button>

    </div>


    <div class="quick">

        <button onclick="usar('AAAA')">AAAA</button>
        <button onclick="usar('AAAR')">AAAR</button>
        <button onclick="usar('AARA')">AARA</button>
        <button onclick="usar('AAVV')">AAVV</button>
        <button onclick="usar('ARAA')">ARAA</button>
        <button onclick="usar('ARRR')">ARRR</button>
        <button onclick="usar('AVAV')">AVAV</button>
        <button onclick="usar('RAAA')">RAAA</button>
        <button onclick="usar('RRRR')">RRRR</button>
        <button onclick="usar('RRRV')">RRRV</button>
        <button onclick="usar('RVRA')">RVRA</button>
        <button onclick="usar('VAAA')">VAAA</button>
        <button onclick="usar('VRRR')">VRRR</button>
        <button onclick="usar('VVVV')">VVVV</button>

    </div>


    <div id="resultado" class="resultado">

        <div id="resultadoSequencia" class="sequencia"></div>

        <div id="resultadoLetra" class="resultado-letra"></div>

        <div id="resultadoDescricao" class="descricao"></div>

    </div>

</section>


<section class="panel">

    <h2>Mostrar padrões</h2>

    <div class="filtros">

        <button
            id="filtroTodos"
            class="ativo"
            onclick="filtrar('TODOS',this)"
        >
            TODOS
        </button>

        <button onclick="filtrar('V',this)">
            RESULTADO V
        </button>

        <button onclick="filtrar('A',this)">
            RESULTADO A
        </button>

        <button onclick="filtrar('R',this)">
            RESULTADO R
        </button>

    </div>

    <div id="contador" class="contador"></div>

    <div id="listaPadroes" class="grid"></div>

</section>


<section class="panel">

    <h2>Últimas consultas</h2>

    <div id="historico" class="historico">
        <div class="vazio">
            Nenhuma consulta realizada.
        </div>
    </div>

</section>


<footer class="footer">

    Sistema de consulta de padrões V/A/R.<br>

    Os resultados devem ser interpretados conforme a regra utilizada
    pelo sistema original.

</footer>

</div>


<script>

/* =========================================================
   PADRÕES DEFINIDOS
   Todas as combinações possíveis de 4 posições:
   3⁴ = 81 combinações
========================================================= */

const padroesDefinidos = [

    {sequencia:"AAAA",resultado:"V"},
    {sequencia:"AAAR",resultado:"A"},
    {sequencia:"AAAV",resultado:"R"},

    {sequencia:"AARA",resultado:"R"},
    {sequencia:"AARR",resultado:"A"},
    {sequencia:"AARV",resultado:"R"},

    {sequencia:"AAVA",resultado:"V"},
    {sequencia:"AAVR",resultado:"V"},
    {sequencia:"AAVV",resultado:"V"},

    {sequencia:"ARAA",resultado:"A"},
    {sequencia:"ARAR",resultado:"A"},
    {sequencia:"ARAV",resultado:"A"},

    {sequencia:"ARRA",resultado:"R"},
    {sequencia:"ARRR",resultado:"R"},
    {sequencia:"ARRV",resultado:"R"},

    {sequencia:"ARVA",resultado:"V"},
    {sequencia:"ARVR",resultado:"V"},
    {sequencia:"ARVV",resultado:"V"},

    {sequencia:"AVAA",resultado:"V"},
    {sequencia:"AVAR",resultado:"V"},
    {sequencia:"AVAV",resultado:"V"},

    {sequencia:"AVRA",resultado:"V"},
    {sequencia:"AVRR",resultado:"V"},
    {sequencia:"AVRV",resultado:"V"},

    {sequencia:"AVVA",resultado:"V"},
    {sequencia:"AVVR",resultado:"V"},
    {sequencia:"AVVV",resultado:"V"},


    {sequencia:"RAAA",resultado:"A"},
    {sequencia:"RAAR",resultado:"A"},
    {sequencia:"RAAV",resultado:"A"},

    {sequencia:"RARA",resultado:"R"},
    {sequencia:"RARR",resultado:"R"},
    {sequencia:"RARV",resultado:"R"},

    {sequencia:"RAVA",resultado:"V"},
    {sequencia:"RAVR",resultado:"V"},
    {sequencia:"RAVV",resultado:"V"},

    {sequencia:"RRAA",resultado:"A"},
    {sequencia:"RRAR",resultado:"A"},
    {sequencia:"RRAV",resultado:"A"},

    {sequencia:"RRRA",resultado:"V"},
    {sequencia:"RRRR",resultado:"V"},
    {sequencia:"RRRV",resultado:"A"},

    {sequencia:"RRVA",resultado:"A"},
    {sequencia:"RRVR",resultado:"A"},
    {sequencia:"RRVV",resultado:"A"},

    {sequencia:"RVAA",resultado:"A"},
    {sequencia:"RVAR",resultado:"A"},
    {sequencia:"RVAV",resultado:"A"},

    {sequencia:"RVRA",resultado:"R"},
    {sequencia:"RVRR",resultado:"A"},
    {sequencia:"RVRV",resultado:"A"},

    {sequencia:"RVVA",resultado:"A"},
    {sequencia:"RVVR",resultado:"A"},
    {sequencia:"RVVV",resultado:"A"},


    {sequencia:"VAAA",resultado:"V"},
    {sequencia:"VAAR",resultado:"V"},
    {sequencia:"VAAV",resultado:"V"},

    {sequencia:"VARA",resultado:"R"},
    {sequencia:"VARR",resultado:"R"},
    {sequencia:"VARV",resultado:"R"},

    {sequencia:"VAVA",resultado:"V"},
    {sequencia:"VAVR",resultado:"V"},
    {sequencia:"VAVV",resultado:"V"},

    {sequencia:"VRAA",resultado:"R"},
    {sequencia:"VRAR",resultado:"R"},
    {sequencia:"VRAV",resultado:"R"},

    {sequencia:"VRRA",resultado:"R"},
    {sequencia:"VRRR",resultado:"R"},
    {sequencia:"VRRV",resultado:"R"},

    {sequencia:"VRVA",resultado:"V"},
    {sequencia:"VRVR",resultado:"V"},
    {sequencia:"VRVV",resultado:"V"},

    {sequencia:"VVAA",resultado:"V"},
    {sequencia:"VVAR",resultado:"V"},
    {sequencia:"VVAV",resultado:"V"},

    {sequencia:"VVRA",resultado:"V"},
    {sequencia:"VVRR",resultado:"V"},
    {sequencia:"VVRV",resultado:"V"},

    {sequencia:"VVVA",resultado:"V"},
    {sequencia:"VVVR",resultado:"V"},
    {sequencia:"VVVV",resultado:"V"}

];


/* =========================================================
   ELEMENTOS
========================================================= */

const entrada = document.getElementById("entrada");
const resultado = document.getElementById("resultado");
const resultadoSequencia =
    document.getElementById("resultadoSequencia");
const resultadoLetra =
    document.getElementById("resultadoLetra");
const resultadoDescricao =
    document.getElementById("resultadoDescricao");

const listaPadroes =
    document.getElementById("listaPadroes");

const contador =
    document.getElementById("contador");

const historico =
    document.getElementById("historico");


/* =========================================================
   NORMALIZAR
========================================================= */

function normalizar(valor){

    return valor
        .toUpperCase()
        .replace(/[^ARV]/g,"")
        .substring(0,4);

}


/* =========================================================
   BUSCAR
========================================================= */

function buscar(){

    const sequencia = normalizar(entrada.value);

    entrada.value = sequencia;

    if(sequencia.length !== 4){

        mostrarErro(
            "Digite exatamente 4 letras usando apenas A, R ou V."
        );

        return;
    }


    const item = padroesDefinidos.find(
        p => p.sequencia === sequencia
    );


    if(!item){

        mostrarErro(
            "Sequência não encontrada."
        );

        return;
    }


    mostrarResultado(item);

    adicionarHistorico(item);

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(item){

    resultado.style.display = "block";

    resultadoSequencia.textContent =
        item.sequencia;

    resultadoLetra.textContent =
        item.resultado;

    resultadoLetra.className =
        "resultado-letra estado-" +
        item.resultado.toLowerCase();

    resultadoDescricao.textContent =
        "Resultado definido para esta sequência.";

}


/* =========================================================
   ERRO
========================================================= */

function mostrarErro(mensagem){

    resultado.style.display = "block";

    resultadoSequencia.textContent =
        "ATENÇÃO";

    resultadoLetra.textContent =
        "—";

    resultadoLetra.className =
        "resultado-letra erro";

    resultadoDescricao.textContent =
        mensagem;

}


/* =========================================================
   USAR BOTÃO RÁPIDO
========================================================= */

function usar(sequencia){

    entrada.value = sequencia;

    buscar();

}


/* =========================================================
   LIMPAR
========================================================= */

function limpar(){

    entrada.value = "";

    resultado.style.display = "none";

    entrada.focus();

}


/* =========================================================
   FILTRAR PADRÕES
========================================================= */

function filtrar(tipo, botao){

    document
        .querySelectorAll(".filtros button")
        .forEach(b => b.classList.remove("ativo"));

    botao.classList.add("ativo");

    let lista;

    if(tipo === "TODOS"){

        lista = padroesDefinidos;

    }else{

        lista = padroesDefinidos.filter(
            p => p.resultado === tipo
        );

    }

    renderizarPadroes(lista);

}


/* =========================================================
   RENDERIZAR PADRÕES
========================================================= */

function renderizarPadroes(lista){

    listaPadroes.innerHTML = "";

    contador.textContent =
        `${lista.length} padrão(ões) exibido(s) de ${padroesDefinidos.length}.`;


    if(lista.length === 0){

        listaPadroes.innerHTML =
            `<div class="vazio">Nenhum padrão encontrado.</div>`;

        return;
    }


    lista.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="seq">
                ${item.sequencia}
            </div>

            <div class="res estado-${item.resultado.toLowerCase()}">
                ${item.resultado}
            </div>

        `;


        card.onclick = function(){

            usar(item.sequencia);

        };


        listaPadroes.appendChild(card);

    });

}


/* =========================================================
   HISTÓRICO
========================================================= */

let historicoDados = [];


function adicionarHistorico(item){

    historicoDados =
        historicoDados.filter(
            h => h.sequencia !== item.sequencia
        );

    historicoDados.unshift(item);

    historicoDados =
        historicoDados.slice(0,10);

    renderizarHistorico();

}


function renderizarHistorico(){

    historico.innerHTML = "";

    if(historicoDados.length === 0){

        historico.innerHTML =
            `<div class="vazio">
                Nenhuma consulta realizada.
             </div>`;

        return;
    }


    historicoDados.forEach(item => {

        const div =
            document.createElement("div");

        div.className = "hist-item";

        div.innerHTML = `

            <span class="hist-seq">
                ${item.sequencia}
            </span>

            <span class="hist-res estado-${item.resultado.toLowerCase()}">
                ${item.resultado}
            </span>

        `;


        div.onclick = function(){

            usar(item.sequencia);

        };


        historico.appendChild(div);

    });

}


/* =========================================================
   ENTER NO CAMPO
========================================================= */

entrada.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            buscar();

        }

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

renderizarPadroes(
    padroesDefinidos
);

entrada.focus();


/* =========================================================
   VERIFICAÇÃO AUTOMÁTICA
========================================================= */

console.log(
    "Total de padrões:",
    padroesDefinidos.length
);

</script>

</body>
</html>
